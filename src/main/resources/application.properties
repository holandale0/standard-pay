# ── StandardPay ─────────────────────────────────────────────────────────────

# Endereço público do StandardPay. Entra no checkoutUrl devolvido ao lojista,
# e é para lá que o pagador é redirecionado — precisa ser alcançável por ele.
standardpay.public-url=${STANDARDPAY_PUBLIC_URL:http://localhost:8080}

# Por quanto tempo uma cobrança espera o pagador antes de expirar.
standardpay.checkout.expires-in=${STANDARDPAY_CHECKOUT_EXPIRES_IN:PT30M}

# De quanto em quanto tempo os webhooks pendentes são enviados, e quantas
# tentativas cada um tem antes de desistir.
standardpay.webhooks.poll-interval=${STANDARDPAY_WEBHOOKS_POLL_INTERVAL:5s}
standardpay.webhooks.max-attempts=${STANDARDPAY_WEBHOOKS_MAX_ATTEMPTS:8}
standardpay.webhooks.timeout=${STANDARDPAY_WEBHOOKS_TIMEOUT:PT10S}

# ── Banco ───────────────────────────────────────────────────────────────────

quarkus.datasource.db-kind=postgresql
# Em produção vêm do ambiente. Em dev e nos testes, ficam vazias e o Quarkus
# sobe um Postgres descartável sozinho (Dev Services) — exige Docker.
%prod.quarkus.datasource.jdbc.url=${STANDARDPAY_DB_URL}
%prod.quarkus.datasource.username=${STANDARDPAY_DB_USER}
%prod.quarkus.datasource.password=${STANDARDPAY_DB_PASSWORD}

quarkus.hibernate-orm.schema-management.strategy=none
# A coluna metadata (jsonb) é gravada com o serializador próprio do Hibernate,
# e não com o da API REST — que pode ser ajustado para a API sem querer mudar o
# que está no banco. Será o padrão do Quarkus em versões futuras.
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.flyway.migrate-at-start=true

# ── HTTP e documentação ─────────────────────────────────────────────────────

quarkus.http.port=${PORT:8080}
# A API fala inglês em qualquer máquina: sem isto, as mensagens padrão de
# validação saíam no idioma do sistema operacional de quem rodasse.
quarkus.default-locale=en
quarkus.swagger-ui.always-include=true

# ── Testes ──────────────────────────────────────────────────────────────────

# Nos testes, os webhooks e a expiração são disparados à mão: um agendador
# rodando em paralelo tornaria as asserções dependentes do relógio.
%test.quarkus.scheduler.enabled=false
%test.standardpay.public-url=http://localhost:8081
