# ── StandardPay ─────────────────────────────────────────────────────────────

# Endereço público do StandardPay. Entra no checkoutUrl devolvido ao lojista,
# e é para lá que o pagador é redirecionado — precisa ser alcançável por ele.
# Sem a variável, acompanha a porta em uso: rodando com PORT=8095, o checkoutUrl
# já sai com :8095, em vez de mandar o pagador para uma porta onde não há nada.
standardpay.public-url=${STANDARDPAY_PUBLIC_URL:http://localhost:${quarkus.http.port}}

# Por quanto tempo uma cobrança espera o pagador antes de expirar.
standardpay.checkout.expires-in=${STANDARDPAY_CHECKOUT_EXPIRES_IN:PT30M}

# De quanto em quanto tempo os webhooks pendentes são enviados, e quantas
# tentativas cada um tem antes de desistir.
standardpay.webhooks.poll-interval=${STANDARDPAY_WEBHOOKS_POLL_INTERVAL:5s}
standardpay.webhooks.max-attempts=${STANDARDPAY_WEBHOOKS_MAX_ATTEMPTS:8}
standardpay.webhooks.timeout=${STANDARDPAY_WEBHOOKS_TIMEOUT:PT10S}

# ── Banco ───────────────────────────────────────────────────────────────────

quarkus.datasource.db-kind=postgresql
# Em produção vêm do ambiente. Em dev e nos testes, ficam vazias e o Quarkus
# sobe um Postgres descartável sozinho (Dev Services) — exige Docker.
%prod.quarkus.datasource.jdbc.url=${STANDARDPAY_DB_URL}
%prod.quarkus.datasource.username=${STANDARDPAY_DB_USER}
%prod.quarkus.datasource.password=${STANDARDPAY_DB_PASSWORD}

# Fixada, e não a padrão do Quarkus: uma atualização do Quarkus trocaria a
# versão maior do banco dos testes sem ninguém perceber. É a mesma do
# docker-compose.yml.
quarkus.datasource.devservices.image-name=postgres:18-alpine

quarkus.hibernate-orm.schema-management.strategy=none
# A coluna metadata (jsonb) é gravada com o serializador próprio do Hibernate,
# e não com o da API REST — que pode ser ajustado para a API sem querer mudar o
# que está no banco. Será o padrão do Quarkus em versões futuras.
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.flyway.migrate-at-start=true

# ── HTTP e documentação ─────────────────────────────────────────────────────

quarkus.http.port=${PORT:8080}
# A API fala inglês em qualquer máquina: sem isto, as mensagens padrão de
# validação saíam no idioma do sistema operacional de quem rodasse.
quarkus.default-locale=en
quarkus.swagger-ui.always-include=true

# ── Observabilidade ─────────────────────────────────────────────────────────

# Logs, métricas e traces saem por OpenTelemetry (OTLP) para um coletor — em
# desenvolvimento, o Grafana do docker-compose (perfil "observabilidade").
# Desligado por padrão: sem coletor no ar, o exportador passaria a reclamar no
# log a cada poucos segundos. Para ligar:
#   QUARKUS_OTEL_SDK_DISABLED=false
#   STANDARDPAY_OTEL_ENDPOINT=http://localhost:4318   (o padrão; só se mudar)
quarkus.otel.sdk.disabled=true
standardpay.otel.endpoint=${STANDARDPAY_OTEL_ENDPOINT:http://localhost:4318}
standardpay.otel.metrics-interval=PT15S
quarkus.otel.service.name=standard-pay
# Traces e logs pelo OpenTelemetry; as métricas, pelo Micrometer (ver OtlpMetrics).
# OTLP sobre HTTP, para os três sinais irem ao mesmo endereço.
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.exporter.otlp.endpoint=${standardpay.otel.endpoint}
quarkus.otel.logs.enabled=true
# As métricas do próprio SDK duplicariam as do Micrometer (requisições HTTP, JVM).
quarkus.otel.metrics.enabled=false
# O Quarkus sobe sozinho um Grafana a cada quarkus:dev quando há extensões de
# observabilidade (Dev Services). Desligado: leva minutos, pesa para quem nem
# quer telemetria, e chegou a derrubar a subida disputando a máquina com o
# Postgres. O Grafana é escolha explícita — perfil "observabilidade" do compose.
quarkus.observability.enabled=false
# Cada consulta ao banco vira um trecho do trace da requisição que a causou.
quarkus.datasource.jdbc.telemetry=true
# As rodadas do agendador (webhooks, expiração) também ganham trace próprio.
quarkus.scheduler.tracing.enabled=true

# No console: hora, nível, categoria, a requisição e o trace a que a linha
# pertence. Em produção, JSON — uma linha por evento, pronta para ser indexada.
quarkus.log.console.format=%d{HH:mm:ss.SSS} %-5p [%c{1.}] [req=%X{requestId} trace=%X{traceId}] %s%e%n
quarkus.log.console.json.enabled=false
%prod.quarkus.log.console.json.enabled=true
quarkus.log.category."org.leonardo.standardpay".level=INFO

# ── Testes ──────────────────────────────────────────────────────────────────

# Nos testes, os webhooks e a expiração são disparados à mão: um agendador
# rodando em paralelo tornaria as asserções dependentes do relógio.
%test.quarkus.scheduler.enabled=false
%test.standardpay.public-url=http://localhost:8081

# Entidades e migrations precisam concordar. Sem isto, uma divergência só
# aparece como ERROR no log do modo dev, depois de a aplicação já ter subido;
# aqui, o teste nem sobe e diz qual coluna discorda.
%test.quarkus.hibernate-orm.schema-management.strategy=validate
