# Postgres para rodar o StandardPay localmente fora do modo dev — e, no perfil
# "app", o próprio StandardPay pela imagem Docker.
#
# No `./mvnw quarkus:dev` e nos testes isto não é necessário: o Quarkus sobe
# um Postgres descartável sozinho (Dev Services). Este é para quando se quer
# os dados persistindo entre execuções, ou rodar o jar empacotado.
#
# A porta é amarrada a 127.0.0.1: o Docker escreve direto no iptables e, sem
# isso, o banco ficaria exposto na rede mesmo com firewall ligado.
services:
  postgres:
    # A mesma versão maior que os testes usam (quarkus.datasource.devservices.image-name).
    image: postgres:18-alpine
    container_name: standardpay-postgres
    environment:
      POSTGRES_DB: standardpay
      POSTGRES_USER: standardpay
      POSTGRES_PASSWORD: standardpay
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      # A partir da imagem 18 o PGDATA fica em /var/lib/postgresql/18/docker, e o
      # volume vai no diretório pai; montado em .../data, como até a 17, a imagem
      # se recusa a subir.
      - standardpay-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U standardpay"]
      interval: 5s
      retries: 10

  # O próprio StandardPay, pela imagem publicada. Só sobe com o perfil:
  #   docker compose --profile app up -d          → http://localhost:8080
  # Com a 8080 ocupada: STANDARDPAY_PORT=8095 docker compose --profile app up -d
  # Para testar uma mudança local sem publicar: docker compose --profile app up -d --build
  standardpay:
    image: ghcr.io/holandale0/standard-pay:latest
    build: .
    container_name: standardpay
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      STANDARDPAY_DB_URL: jdbc:postgresql://postgres:5432/standardpay
      STANDARDPAY_DB_USER: standardpay
      STANDARDPAY_DB_PASSWORD: standardpay
      # O endereço que o pagador abre no navegador — o da máquina, não o do contêiner.
      STANDARDPAY_PUBLIC_URL: http://localhost:${STANDARDPAY_PORT:-8080}
      # Prazos dos estornos lentos; para demonstrar, algo como PT2M.
      STANDARDPAY_REFUNDS_DELAYED_BY: ${STANDARDPAY_REFUNDS_DELAYED_BY:-P3D}
      STANDARDPAY_REFUNDS_FAILS_AFTER: ${STANDARDPAY_REFUNDS_FAILS_AFTER:-PT1M}
      # Quanto o saldo do split fica pendente antes de ficar disponível.
      STANDARDPAY_BALANCES_AVAILABLE_AFTER: ${STANDARDPAY_BALANCES_AVAILABLE_AFTER:-P1D}
      # Com o perfil observabilidade junto, basta trocar para "false".
      QUARKUS_OTEL_SDK_DISABLED: "true"
      STANDARDPAY_OTEL_ENDPOINT: http://observabilidade:4318
    ports:
      - "127.0.0.1:${STANDARDPAY_PORT:-8080}:8080"

  # Grafana com Prometheus, Tempo e Loki num contêiner só, recebendo os três
  # sinais por OTLP. Só sobe com o perfil: docker compose --profile observabilidade up -d
  # Grafana na 3001, e não na 3000 padrão, que costuma estar com outro serviço local.
  observabilidade:
    image: grafana/otel-lgtm:0.36.0
    container_name: standardpay-observabilidade
    profiles: ["observabilidade"]
    ports:
      - "127.0.0.1:3001:3000"   # Grafana (admin / admin)
      - "127.0.0.1:4318:4318"   # OTLP sobre HTTP: traces, métricas e logs
    volumes:
      - ./observabilidade/painel-provisioning.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/standardpay.yaml:ro
      - ./observabilidade/paineis:/otel-lgtm/grafana/conf/provisioning/dashboards/standardpay:ro
      # O Grafana cria o próprio banco na primeira subida, e isso leva minutos. Com
      # o volume, só na primeira vez; e a telemetria sobrevive a reinícios.
      - standardpay-observabilidade:/data

volumes:
  standardpay-data:
  standardpay-observabilidade:
