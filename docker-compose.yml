# Postgres para rodar o StandardPay localmente fora do modo dev.
#
# No `./mvnw quarkus:dev` e nos testes isto não é necessário: o Quarkus sobe
# um Postgres descartável sozinho (Dev Services). Este é para quando se quer
# os dados persistindo entre execuções, ou rodar o jar empacotado.
#
# A porta é amarrada a 127.0.0.1: o Docker escreve direto no iptables e, sem
# isso, o banco ficaria exposto na rede mesmo com firewall ligado.
services:
  postgres:
    # A mesma versão maior que os testes usam (quarkus.datasource.devservices.image-name).
    image: postgres:18-alpine
    container_name: standardpay-postgres
    environment:
      POSTGRES_DB: standardpay
      POSTGRES_USER: standardpay
      POSTGRES_PASSWORD: standardpay
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      # A partir da imagem 18 o PGDATA fica em /var/lib/postgresql/18/docker, e o
      # volume vai no diretório pai; montado em .../data, como até a 17, a imagem
      # se recusa a subir.
      - standardpay-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U standardpay"]
      interval: 5s
      retries: 10

volumes:
  standardpay-data:
